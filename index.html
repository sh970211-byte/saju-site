<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<title>무료로 사주 봐드림 ♥</title>
<style>
:root{--bg:#f4f1ff;--grad:linear-gradient(180deg,#dcecff 0%,#f6eefa 38%,#ffeaf2 62%,#e9e2fb 100%);--pg:linear-gradient(135deg,#ffdce9 0%,#e6dcfb 50%,#d2e8fd 100%);--card:#fffafcd9;--ink:#0f1424;--txt:#1b2236;--sub:#3f4863;--line:#e3dcf3;--acc:#6f8fe8;--on:#fff;--bar:linear-gradient(90deg,#ffb3cf,#cbb7f4,#9ccaf7);--track:#ece6f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c27;--grad:none;--card:#1b2b3a;--ink:#f6fbff;--txt:#e3edf6;--sub:#b3c4d6;--line:#2c4357;--acc:#7cc4ff;--on:#0f1d29;--bar:linear-gradient(90deg,#9fdcff,#7cc4ff,#4aa3e8);--track:#2c4357;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101c27;--grad:none;--card:#1b2b3a;--ink:#f6fbff;--txt:#e3edf6;--sub:#b3c4d6;--line:#2c4357;--acc:#7cc4ff;--on:#0f1d29;--bar:linear-gradient(90deg,#9fdcff,#7cc4ff,#4aa3e8);--track:#2c4357;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--grad);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-stroke:.25px currentColor}
main{max-width:560px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:"Jua","Gowun Dodum",sans-serif;font-size:34px;letter-spacing:-.02em;margin:0 0 8px;font-weight:400;color:var(--ink)}
.lead{color:var(--sub);margin:0 0 28px;font-size:15px}.by{margin:0 0 10px;font-size:14px;color:var(--sub)}.by a{color:var(--acc);text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 6px 20px rgba(160,140,230,.18)}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=number]{-moz-appearance:textfield;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;gap:8px}.row input{min-width:0;flex:1}.row .seg{margin:0}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{flex:1;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;cursor:pointer}
.seg input:checked+span{background:var(--pg);color:#2b2a4a;border-color:transparent}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin-top:10px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--pg);color:#2b2a4a;font:inherit;font-size:17px;cursor:pointer}
.err{color:#c0392b;font-size:14px;margin-top:10px;min-height:1em}
#out{display:none}
h2{font-family:"Jua","Gowun Dodum",sans-serif;font-size:25px;font-weight:400;color:var(--ink);letter-spacing:-.01em;margin:38px 0 12px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px 6px;text-align:center}
.p small{display:block;color:var(--sub);font-size:13px;margin-bottom:6px}
.bx{border-radius:12px;padding:10px 0 7px;margin-bottom:6px;border:1px solid rgba(0,0,0,.12)}.bx b{display:block;font-size:28px;font-weight:400;line-height:1.2;font-family:"Noto Serif KR","Apple Myungjo",serif}.bx.m{background:#8fd9a0;color:#10361a}.bx.f{background:#ff8f88;color:#5a1410}.bx.t{background:#ffe27a;color:#4d3b00}.bx.g{background:#fff;color:#2b2f3a}.bx.w{background:#2f3340;color:#fff}.bx.x{background:var(--track);color:var(--sub)}
.bx i{display:block;font-style:normal;font-size:13px}.bx u{display:block;text-decoration:none;font-size:11px;opacity:.85}
.p.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.hero{font-family:"Jua","Gowun Dodum",sans-serif;font-size:22px;font-weight:400;margin:0 0 6px}
.hero+p,.card p{margin:0;font-size:16.5px;color:var(--txt)}
.el{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0}
.el span:first-child{width:44px}
.tr{height:6px;flex:1;background:var(--track);border-radius:3px;overflow:hidden}
.tr div{height:100%;background:var(--bar);border-radius:3px}
.el span:last-child{width:28px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.t{padding:16px 0;border-top:1px solid var(--line)}
.t:first-child{border-top:0;padding-top:0}
.t:last-child{padding-bottom:0}
.th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.th b{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:20px}.th em{font-style:normal;font-size:24px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.t p{margin-top:8px}
.mbti{font-family:"Jua","Gowun Dodum",sans-serif;font-size:44px;font-weight:400;color:var(--acc);letter-spacing:.06em;margin:0 0 6px}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:28px}
.re{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:18px}
</style>
</head>
<body>
<main>
<h1>무료로 사주 봐드림 <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" style="vertical-align:-4px;margin-left:2px"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ec7"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><path d="M16 28.5C6 21.2 3 16 3 11.2 3 7.2 6 4.5 9.6 4.5c2.6 0 4.7 1.4 6.4 3.9 1.7-2.5 3.8-3.9 6.4-3.9C26 4.5 29 7.2 29 11.2c0 4.8-3 10-13 17.3z" fill="url(#hg)"/><path d="M9.5 9.2c-2 .6-3 2.4-2.7 4.3" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" fill="none"/></svg></h1>
<p class="by">Made by <a href="https://www.instagram.com/memezoo_mzu" target="_blank" rel="noopener noreferrer">MZu</a> · <a href="https://www.instagram.com/memezoo_mzu" target="_blank" rel="noopener noreferrer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Instagram" style="vertical-align:-3px"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg> @memezoo_mzu</a></p>
<p class="lead">내 성격, 돈복, 매력, 연애는 어떻게 나올까?</p>

<form class="card" id="f" onsubmit="return false">
<label>생년월일</label><div class="row" style="margin-bottom:8px"><label class="seg"><input type="radio" name="c" value="s" checked><span>양력</span></label><label class="seg"><input type="radio" name="c" value="l"><span>음력</span></label></div>
<div class="row"><input type="number" id="yy" inputmode="numeric" placeholder="년 (1995)"><input type="number" id="mm" inputmode="numeric" placeholder="월"><input type="number" id="dd" inputmode="numeric" placeholder="일"></div><div class="chk" id="lp" style="display:none"><input type="checkbox" id="lm"><label for="lm" style="margin:0">윤달이에요</label></div>
<label>태어난 시간 (24시간제 · 오후 11시 31분 → 23시 31분)</label>
<div class="row"><input type="number" id="hh" inputmode="numeric" placeholder="시 (0~23)"><input type="number" id="mn" inputmode="numeric" placeholder="분 (0~59)"></div>
<div class="chk"><input type="checkbox" id="nt"><label for="nt" style="margin:0">시간은 몰라요</label></div>
<label>성별</label>
<div class="row">
<label class="seg"><input type="radio" name="g" value="m" checked><span>남</span></label>
<label class="seg"><input type="radio" name="g" value="f"><span>여</span></label>
</div>
<button id="go">내 사주 보기</button>
<div class="err" id="err"></div>
</form>

<div id="out"></div>
<p class="note">재미로 보는 풀이예요. 입력한 정보는 서버로 전송되지 않고 이 브라우저 안에서만 계산돼요.</p>
</main>
<script>
const S="갑을병정무기경신임계",B="자축인묘진사오미신유술해";
const SH="甲乙丙丁戊己庚辛壬癸",BH="子丑寅卯辰巳午未申酉戌亥";
const SE=[0,0,1,1,2,2,3,3,4,4],BE=[4,2,0,0,2,1,1,2,3,3,2,4];
const EN=["목","화","토","금","수"];
const DM=["큰 나무 — 곧고 추진력 있는 리더형","풀과 덩굴 — 유연하고 적응력 좋은 타입","태양 — 밝고 열정적인 분위기 메이커","촛불 — 섬세하고 은근히 따뜻한 사람","큰 산 — 듬직하고 중심이 단단한 사람","논밭 — 포용력 있고 실속 챙기는 사람","바위와 쇠 — 의리 있고 결단이 빠른 사람","보석 — 예리하고 감각이 섬세한 사람","바다 — 생각이 깊고 스케일이 큰 사람","이슬비 — 직관 좋고 감성이 풍부한 사람"];
const SJ=0,BJ=1;
function rel(me,x){if(x==me)return 0;if((me+1)%5==x)return 1;if((me+2)%5==x)return 2;if((x+2)%5==me)return 3;return 4}
function calc(y,m,d,h,mi){
 const md=m*100+d;
 const ty=md<204?y-1:y;
 const yi=((ty-4)%60+60)%60;
 const T=[[1207,0],[1107,11],[1008,10],[908,9],[808,8],[707,7],[606,6],[506,5],[405,4],[306,3],[204,2],[106,1]];
 let mb=0;for(const[t,b]of T){if(md>=t){mb=b;break}}
 const ms=((yi%10%5)*2+2+(mb-2+12)%12)%10;
 const di=Math.round((Date.UTC(y,m-1,d)-Date.UTC(2000,0,1))/864e5);
 const tt=h===null?0:h*60+mi;const dx=((54+di+(tt>=1410?1:0))%60+60)%60;
 const P=[{s:yi%10,b:yi%12},{s:ms,b:mb},{s:dx%10,b:dx%12}];
 if(h!==null){const hb=Math.floor(((tt+30)%1440)/120);P.push({s:((dx%10%5)*2+hb)%10,b:hb})}
 return P;
}
function T3(a,v){return a[v<68?0:v<82?1:2]}
const TX={
눈치:["직설적이고 솔직한 편이에요. 분위기보다 본론이 먼저라 가끔 '눈치 없다'는 말을 들을 수 있지만, 뒤끝 없는 게 장점이에요.","필요할 땐 분위기를 읽고 필요 없을 땐 신경 끄는, 균형 잡힌 눈치를 가졌어요.","표정 하나, 말투 하나로 상대 기분을 읽어내는 레이더형. 다만 너무 신경 쓰다 혼자 지칠 수 있어요."],
연애능력:["연애에 서툴거나 천천히 가는 타입이에요. 마음을 열면 오래, 깊게 가는 스타일이에요.","끌림과 안정감 사이에서 균형을 잘 잡아요. 한번 마음 주면 꾸준해요.","매력과 표현력이 좋아 인연이 끊이지 않는 편이에요. 대신 선택이 많아 고민도 많아요."],
처세술:["자기 소신이 강해서 맞추는 건 약간 어려워요. 대신 믿고 맡길 수 있는 사람이라는 평을 들어요.","적당히 맞추고 적당히 지키는 무난한 처세가 가능해요.","어느 자리에서든 포지션을 잘 잡는 사회생활 고수예요. 사람 덕이 따라오는 구조예요."],
판단력:["직관과 순발력으로 움직여요. 빠르지만 가끔 후회할 수 있으니 중요한 건 하루 묵혀보세요.","감과 분석이 적당히 섞인 안정적인 판단을 해요.","정보를 충분히 모으고 신중하게 결정하는 타입이에요. 판단이 정확한 만큼 시간이 걸릴 때도 있어요."],
말빨:["말보다 행동으로 보여주는 쪽이에요. 한마디 한마디가 묵직해서 말수가 적어도 신뢰가 가요.","필요한 말을 필요한 때에 하는 깔끔한 화법이에요.","분위기를 휘어잡는 입담의 소유자예요. 설득과 농담, 둘 다 잘해요."],
글빨:["짧고 굵게 쓰는 스타일이에요. 길게 쓰기보다 핵심을 찌르는 쪽이 맞아요.","읽기 편한 담백한 글을 써요. 연습하면 금방 늘어요.","감성과 논리를 함께 담는 글솜씨예요. 기록하고 글 쓰는 일이 잘 맞아요."],
돈버는능력:["큰돈을 쫓기보다 꾸준히 모으는 쪽이 어울려요. 기술이나 전문성으로 안정적인 수입을 만드는 게 좋아요.","수입 구조를 차근차근 키워갈 수 있어요. 본업과 부업을 병행하면 효과가 커요.","돈의 흐름을 읽는 감각이 있어요. 기회가 오면 과감하게 잡는 편이라 수입 규모를 키울 잠재력이 커요."]
};
const TX2={
눈치:["돌려 말하는 것보다 솔직하게 말하는 게 편한 타입이에요. 분위기보다 사실 위주로 반응하다 보니 가끔 눈치 없다는 소리를 들을 수 있어요. 하지만 뒤끝이 없고 속이 보여서 오히려 편하다는 사람도 많아요. 중요한 자리에선 한 박자 쉬고 상대 표정을 살피면 훨씬 좋아져요.","필요할 땐 분위기를 읽고, 필요 없을 땐 신경 끄는 균형 잡힌 눈치예요. 상대가 불편해하는 순간은 대체로 알아차리지만 모든 걸 맞추려고 하진 않아요. 그래서 편안하다는 평을 듣기 쉽고, 피곤할 정도로 눈치 보는 일도 적어요.","표정, 말투, 침묵의 길이까지 읽어내는 레이더 같은 눈치예요. 상대가 말하기 전에 뭘 원하는지 먼저 알아채서 센스 있다는 말을 자주 들어요. 다만 너무 많이 읽다 보니 혼자 신경 쓰고 지칠 수 있어요. 때로는 모른 척하는 것도 능력이에요."],
연애능력:["연애에선 조금 느리고 서툰 편이에요. 마음이 있어도 표현하지 못하거나 타이밍을 놓치기 쉬워요. 대신 한번 마음을 열면 깊고 오래 가는 스타일이라 진지한 관계에서 빛나요. 작은 표현이라도 말로 하는 연습이 연애운을 크게 올려줘요.","끌림과 안정감 사이에서 균형을 잘 잡는 연애 스타일이에요. 밀고 당기기보다 자연스럽게 가까워지는 걸 좋아하고, 한번 마음을 주면 꾸준해요. 상대의 이야기를 잘 들어주는 점이 가장 큰 무기예요.","매력과 표현력이 좋아서 인연이 끊이지 않는 편이에요. 호감을 얻는 법을 본능적으로 알고 관계의 온도 조절도 잘해요. 다만 선택지가 많아 고민이 길어지거나 쉽게 설레고 쉽게 식을 수 있으니, 진짜 원하는 사람의 기준을 정해두면 좋아요."],
처세술:["소신이 강하고 타협이 쉽지 않은 타입이에요. 요령 좋게 비위 맞추는 건 어렵지만 그만큼 믿고 맡길 수 있는 사람이라는 평을 들어요. 윗사람이나 어려운 자리에서는 결론 전에 한마디만 더 얹으면 손해를 크게 줄일 수 있어요.","적당히 맞추고 적당히 지키는 무난한 처세를 해요. 조직 안에서 튀지도 묻히지도 않는 안정적인 포지션을 잡고, 갈등이 생겨도 크게 번지지 않게 정리하는 힘이 있어요.","어느 자리에서든 내 포지션을 정확히 잡는 사회생활 고수예요. 누구와 친해져야 하는지, 언제 나서고 빠질지 감이 좋아서 사람 덕이 따라와요. 다만 모두에게 잘하려다 정작 내 마음을 놓칠 수 있으니 가끔은 싫다고 말하는 연습도 필요해요."],
판단력:["직관과 순발력으로 움직이는 타입이에요. 결정이 빠르고 실행도 빠른 대신 확인이 부족해서 후회할 때가 있어요. 큰 결정은 하루만 묵혔다가 체크리스트로 한 번 점검하면 실수가 확 줄어요.","감과 분석이 적당히 섞인 안정적인 판단을 해요. 정보가 충분하면 정확하고, 부족해도 크게 틀리지 않는 감각이 있어요. 주변 의견을 한두 명만 더 들으면 완성도가 높아져요.","정보를 충분히 모으고 따져본 뒤 결정하는 신중한 판단형이에요. 결과의 정확도가 높아 주변에서 조언을 구하는 일이 많아요. 다만 생각이 길어져 타이밍을 놓칠 수 있으니 마감 기한을 정해두고 결정하는 걸 추천해요."],
말빨:["말보다 행동으로 보여주는 쪽이에요. 말수는 적지만 한마디가 묵직해서 신뢰가 가요. 설득이 필요한 자리에서는 핵심을 세 줄로 정리해서 말하면 전달력이 크게 좋아져요.","필요한 말을 필요한 때에 하는 깔끔한 화법이에요. 장황하지 않아 듣는 사람이 편하고 정리해서 설명하는 능력이 있어요. 유머를 한 스푼 더하면 매력이 확 올라가요.","분위기를 휘어잡는 입담의 소유자예요. 설득도 잘하고 농담도 잘해서 어디서든 대화의 중심이 되기 쉬워요. 말이 빠른 만큼 가끔 실언이 생길 수 있으니 중요한 말은 한 번 더 걸러서 하면 완벽해요."],
글빨:["길게 쓰는 것보다 짧고 굵게 쓰는 게 맞는 타입이에요. 핵심만 찌르는 문장이 오히려 힘이 있어요. 결론, 이유, 예시 순서로 구조만 잡아두면 금방 글이 좋아져요.","읽기 편한 담백한 글을 써요. 어렵게 꾸미지 않아서 전달력이 좋고, 연습하면 빠르게 느는 스타일이에요. 일기나 짧은 후기부터 꾸준히 써보면 실력이 눈에 띄게 늘어요.","감성과 논리를 함께 담는 글솜씨예요. 같은 이야기도 술술 읽히게 풀어내서 기획서, 블로그, 에세이 모두 잘 어울려요. 글로 돈을 벌 수도 있는 재능이니 기록을 습관으로 만들어 보세요."],
돈버는능력:["큰돈을 한 방에 노리기보다 꾸준히 쌓아 가는 쪽이 어울려요. 기술이나 전문성으로 안정적인 수입을 만들고 지출 관리부터 단단히 하면 자산이 천천히 불어나요. 무리한 투자나 보증은 피하는 게 좋아요.","수입 구조를 차근차근 키워갈 수 있는 타입이에요. 본업에 부업이나 투자 하나를 더하면 효과가 커요. 돈이 들어오는 길을 두세 개로 나눠두면 훨씬 안정적이에요.","돈의 흐름을 읽는 감각이 있어요. 기회가 보이면 과감하게 잡는 편이라 수입 규모를 키울 잠재력이 커요. 다만 들어오는 만큼 나가기도 쉬우니 저축과 투자 비율을 자동화해 두는 걸 추천해요."]};
TX2.정신력=['마음이 섬세해서 주변 말과 분위기에 쉽게 흔들리는 편이에요. 걱정이 한번 시작되면 꼬리를 물고 이어져서 지치는 날도 있어요. 하지만 감정에 민감하다는 건 공감 능력이 높다는 뜻이기도 해요. 환경을 정리하고 나만의 루틴을 만들면 의외로 빨리 안정을 되찾는 타입이에요.','평소에는 담담하게 버티다가 크게 힘든 일이 생기면 잠깐 흔들리지만 금세 중심을 되찾는 정신력이에요. 스트레스를 받아도 스스로 수습하는 힘이 있고, 주변 도움을 받으면 회복이 더 빨라요. 무리하게 참기보다 적당히 풀어주는 습관이 있으면 오래 단단하게 갈 수 있어요.','웬만한 일에는 흔들리지 않는 강철 멘탈형이에요. 위기 상황에서도 차분하게 해결책을 찾고, 실패해도 다시 일어서는 회복력이 뛰어나요. 다만 힘든 걸 혼자 삭이다 한꺼번에 지칠 수 있으니 속마음을 나눌 사람이 꼭 필요해요. 단단함 속에 여유를 챙기면 더 좋아요.'];
const TIP={
정신력:['마음이 지치는 날엔 억지로 버티지 말고 쉬는 시간을 일정에 먼저 넣어두세요. 믿을 수 있는 사람 한두 명에게 털어놓는 것만으로도 회복 속도가 크게 달라져요.','단단한 만큼 혼자 다 짊어지려는 경향이 있어요. 가끔은 약한 모습을 보여도 괜찮고, 그게 오히려 관계를 더 깊게 만들어줘요.'],
눈치:['상대 말을 끝까지 듣고 한 번 되묻는 습관만 들여도 오해가 확 줄어요. 상대 표정이 굳을 때는 화제를 바꿔보는 것도 좋은 방법이에요.','눈치가 빠른 건 큰 재능이지만 모든 걸 내 책임으로 느끼지는 마세요. 상대 감정은 상대 몫이라고 선을 긋는 연습이 마음 건강에 도움이 돼요.'],
연애능력:['호감이 가는 사람에겐 작은 안부 한마디부터 시작해 보세요. 완벽한 타이밍을 기다리기보다 가볍게 다가가는 쪽이 인연을 만들어줘요.','관계가 쉽게 풀리는 만큼 상대에게 진심인지 스스로 점검하는 시간이 필요해요. 한 사람에게 깊이 집중할수록 연애운이 단단해져요.'],
처세술:['내 의견을 말하기 전에 그럴 수 있겠네요 한마디를 먼저 붙여 보세요. 같은 말도 훨씬 부드럽게 전달되고 적도 줄어요.','넓은 인맥을 유지하는 만큼 에너지 관리가 중요해요. 진짜 내 편이 누구인지 가려서 깊게 챙기는 것도 처세의 한 부분이에요.'],
판단력:['결정 전에 최악의 경우를 한 번만 상상해 보세요. 대비책이 있다면 과감하게 가고, 없다면 한 번 더 확인하고 움직이면 돼요.','완벽한 정보를 기다리다 기회를 놓치지 않도록 70% 확신이 들면 움직인다는 기준을 세워 보세요. 결정 후에는 뒤돌아보지 않는 연습도 필요해요.'],
말빨:['중요한 대화 전에 할 말 세 가지만 메모해 두면 훨씬 자신 있게 말할 수 있어요. 말을 줄이는 건 약점이 아니라 개성이라는 점도 기억하세요.','말이 잘 통하는 사람일수록 듣는 시간이 신뢰를 만들어요. 상대 말을 끝까지 듣고 답하는 습관이 말빨을 한 단계 올려줘요.'],
글빨:['하루 세 줄 기록부터 시작해 보세요. 쓰는 양이 쌓이면 어느 순간 문장이 자연스럽게 흘러요. 좋아하는 글을 필사해 보는 것도 도움이 돼요.','생각을 글로 정리하는 습관이 판단과 인간관계에도 좋은 영향을 줘요. 블로그나 SNS에 꾸준히 올리면 기회가 되어 돌아올 수 있어요.'],
돈버는능력:['고정 지출을 먼저 파악하고 매달 일정 금액을 자동이체로 빼두는 것부터 시작하세요. 작은 수입원 하나를 더 만들면 마음이 훨씬 편해져요.','수입이 커질수록 지출 습관이 더 중요해요. 목돈은 쓰는 계좌와 분리하고, 투자는 공부한 만큼만 하는 원칙을 세워두세요.']};
const MB={INTJ:['전략가','계획적이고 독립적이며 큰 그림을 설계하는 타입이에요.'],INTP:['논리술사','호기심 많고 분석적이며 원리를 파고드는 타입이에요.'],ENTJ:['통솔자','목표 지향적이고 결단력 있는 리더형이에요.'],ENTP:['변론가','아이디어가 넘치고 토론을 즐기는 타입이에요.'],INFJ:['옹호자','통찰력 있고 신념이 깊은 이상주의자예요.'],INFP:['중재자','감성적이고 가치관이 뚜렷한 몽상가 타입이에요.'],ENFJ:['선도자','사람을 이끌고 챙기는 따뜻한 리더예요.'],ENFP:['활동가','열정적이고 자유로운 분위기 메이커예요.'],ISTJ:['현실주의자','책임감 강하고 원칙을 지키는 성실파예요.'],ISFJ:['수호자','헌신적이고 세심하게 사람을 챙기는 타입이에요.'],ESTJ:['경영자','체계적이고 실행력이 강한 관리자형이에요.'],ESFJ:['집정관','사교적이고 주변을 살뜰히 챙기는 타입이에요.'],ISTP:['장인','침착하고 문제 해결에 능한 실용파예요.'],ISFP:['모험가','온화하고 감각적이며 자유를 사랑하는 타입이에요.'],ESTP:['사업가','행동이 빠르고 현실 감각이 뛰어난 타입이에요.'],ESFP:['연예인','에너지 넘치고 순간을 즐기는 사교가예요.']};
const CH={
성격:["한번 정한 방향으로 곧게 뻗어가는 성격이에요. 책임감이 강하고 리더 역할을 자연스럽게 맡지만, 고집이 세서 꺾이는 걸 싫어해요.","겉은 부드럽고 속은 끈질긴 성격이에요. 환경에 맞춰 유연하게 변하며 끝까지 살아남는 생활력이 있고, 눈치가 빠르지만 속마음은 잘 안 드러내요.","숨김없이 밝고 에너지 넘치는 성격이에요. 사람들을 끌어당기는 열정이 있지만 화도 금방 나고 금방 풀리는 급한 면이 있어요.","차분하고 섬세하며 속정이 깊은 성격이에요. 한 사람, 한 가지에 오래 집중하는 힘이 있지만 상처도 오래 기억하는 편이에요.","무게감 있고 믿음직한 성격이에요. 쉽게 흔들리지 않고 포용력이 크지만 변화에는 느리고 속을 잘 안 보여줘요.","겸손하고 실속 있는 성격이에요. 사람을 키우고 챙기는 데 능하고 현실 감각이 좋지만, 걱정이 많아 생각이 길어지는 면이 있어요.","의리와 결단력이 강한 성격이에요. 옳고 그름이 분명해서 시원시원하지만 말투가 직설적이라 오해를 사기도 해요.","예민하고 감각이 뛰어난 완벽주의 성격이에요. 자존심이 강하고 디테일에 강하지만 상처받은 마음을 쉽게 풀지 못해요.","생각이 깊고 스케일이 큰 성격이에요. 지혜롭고 적응력이 좋으며 자유로운 영혼이지만 한곳에 매이는 걸 답답해해요.","직관과 감수성이 풍부한 성격이에요. 조용히 스며드는 영리함과 높은 공감 능력이 있지만, 생각이 많아 걱정이 쉽게 커져요."],
매력:["믿음직한 리더십과 곧은 눈빛이 매력이에요. 말은 적어도 중심을 잡아주는 든든함에 사람들이 의지해요.","부드러운 분위기와 센스 있는 배려가 매력이에요. 곁에 있으면 편안하고 자꾸 챙겨주고 싶은 사람이에요.","존재만으로 분위기가 환해지는 밝은 에너지가 매력이에요. 솔직하고 시원한 리액션에 사람들이 끌려요.","은은하고 따뜻한 눈빛과 섬세한 배려가 매력이에요. 알수록 빠져드는 슬로우 스타일 매력이에요.","흔들리지 않는 안정감과 넉넉한 품이 매력이에요. 말없이 곁을 지켜주는 든든함이 있어요.","다정하고 실속 있는 따뜻함이 매력이에요. 사소한 것까지 챙겨주는 생활형 배려에 사람들이 감동해요.","시원시원한 결단력과 의리가 매력이에요. 한 번 내 사람이면 끝까지 챙기는 강단에 반해요.","세련된 감각과 단정한 이미지가 매력이에요. 차갑게 보이다가 가까워지면 보이는 반전이 큰 무기예요.","깊이를 알 수 없는 신비로움과 넓은 포용력이 매력이에요. 대화가 잘 통하고 자유로운 분위기에 끌려요.","촉촉한 감성과 맑은 분위기가 매력이에요. 공감 능력이 좋아서 이야기를 들어주는 것만으로 마음을 사로잡아요."],
강점:["목표를 정하면 밀고 나가는 추진력과 책임감이 가장 큰 강점이에요. 팀을 이끌고 방향을 제시하는 일에 강해요.","유연한 적응력과 끈기가 강점이에요. 어떤 환경에서도 살아남고 사람 사이를 잇는 조율에 능해요.","열정과 표현력이 강점이에요. 분위기를 띄우고 사람을 모으는 힘이 있고, 일을 시작하는 추진력이 좋아요.","집중력과 섬세함이 강점이에요. 한 분야를 깊게 파고드는 끈기와 사람 마음을 읽는 능력이 있어요.","중심을 잡는 안정감과 신뢰가 강점이에요. 큰 일을 맡겨도 흔들리지 않는 묵직함이 있어요.","현실 감각과 관리 능력이 강점이에요. 사람과 일을 차근차근 키워내는 실무형 능력자예요.","결단력과 실행력이 강점이에요. 위기 때 빠르게 정리하고 밀어붙이는 힘이 있어요.","분석력과 완성도가 강점이에요. 디테일을 놓치지 않고 결과물의 퀄리티를 끌어올려요.","큰 그림을 보는 안목과 지혜가 강점이에요. 정보 수집과 흐름 파악, 아이디어 확장에 능해요.","직관과 통찰력이 강점이에요. 조용히 관찰해서 핵심을 짚어내고 연구와 기획에 재능이 있어요."],
약점:["고집과 자존심이 약점이에요. 굽히지 않다가 관계나 기회를 놓칠 수 있으니 한 템포 유연함이 필요해요.","우유부단하고 속마음을 숨기는 게 약점이에요. 눈치를 보다 하고 싶은 말을 삼키지 않게 주의하세요.","급한 성격과 끈기 부족이 약점이에요. 시작은 화려한데 마무리가 약해질 수 있어요.","예민함과 뒤끝이 약점이에요. 작은 말에 오래 상처받고 혼자 삭이다 지칠 수 있어요.","변화에 느리고 고집이 센 게 약점이에요. 마음을 표현하지 않아 오해가 쌓이기도 해요.","걱정과 눈치가 많은 게 약점이에요. 남을 챙기다 내 것을 놓치고 소심해질 수 있어요.","직설적인 말투와 강한 승부욕이 약점이에요. 상대에게 상처를 주고 나서 후회하기도 해요.","예민함과 완벽주의가 약점이에요. 스스로를 몰아붙이다 쉽게 지치고 서운함을 오래 담아둬요.","산만함과 끈기 부족이 약점이에요. 생각이 많아 실행이 늦어지거나 한곳에 정착하기 힘들어요.","걱정이 많고 감정 기복이 있는 게 약점이에요. 혼자 상상하다 불안이 커지지 않게 주의하세요."],
이성:["내 고집을 받아주면서도 할 말은 하는 침착하고 현명한 사람이 잘 맞아요. 부드럽지만 기준이 확실한 상대, 서로의 목표를 응원하는 관계가 오래 가요.","든든하게 중심을 잡아주는 안정적인 사람이 어울려요. 말수가 적어도 약속을 지키는 신뢰형 상대와 함께하면 마음이 편해져요.","열정을 받아주면서 차분하게 식혀주는 사람이 어울려요. 내 에너지를 지지해 주는 포용력 있는 상대면 오래 가요.","따뜻하고 안정적이며 표현이 확실한 사람이 어울려요. 섬세한 마음을 알아주고 먼저 다가와 주는 상대가 좋아요.","활발하고 표현이 풍부한 사람이 어울려요. 내가 놓치는 분위기를 밝혀주고 새로운 자극을 주는 상대와 균형이 맞아요.","나를 믿고 이끌어주는 듬직한 사람이 어울려요. 내가 걱정할 때 결단해 주고 안심시켜 주는 상대가 잘 맞아요.","따뜻하고 지혜롭게 내 날을 눌러주는 사람이 어울려요. 거친 말에도 상처받지 않고 감정을 받아주는 상대가 좋아요.","속 깊고 여유 있는 사람이 어울려요. 예민함을 이해하고 편안하게 감싸주는 포용형 상대와 함께하면 안정돼요.","중심을 잡아주는 현실적이고 단단한 사람이 어울려요. 자유로운 나를 이해하면서도 방향을 잡아주는 상대가 좋아요.","따뜻하고 안정적으로 곁에 있어 주는 사람이 어울려요. 감정의 기복을 편안하게 받아주는 포용력 있는 상대가 잘 맞아요."]};
CH.이성2=['겉으로는 순해 보여도 속에 자기 기준이 단단한 사람, 그리고 일이나 목표에 진지한 사람과 궁합이 좋아요. 반대로 내 의견에 무조건 따르기만 하는 사람은 금방 지루해질 수 있고, 같은 고집형끼리는 부딪치기 쉬우니 한쪽이 먼저 한발 물러서는 관계가 오래 가요.','대화가 통하고 약속을 잘 지키는 사람이 가장 편해요. 감정 기복이 크거나 말을 돌려 하는 사람은 쉽게 지치게 하니 피하는 게 좋고, 내가 눈치를 보지 않아도 되는 솔직한 사람을 만나면 숨겨둔 매력이 활짝 열려요.','표현이 솔직하고 뒤끝 없는 사람과 잘 맞아요. 나를 통제하려 하거나 감정을 차갑게 식히는 사람은 맞지 않고, 내 열정을 귀엽게 봐주는 상대가 오래 가요. 다투더라도 바로 풀 수 있는 대화 방식을 가진 사람인지 꼭 보세요.','말보다 행동으로 마음을 보여주는 진중한 사람이 좋아요. 가볍게 감정을 소비하는 사람은 큰 상처가 될 수 있으니 천천히 사귀면서 확인하세요. 내 섬세함을 예민하다고 하지 않고 고마워해 주는 사람이 진짜 인연이에요.','약속을 지키고 책임감 있는 사람과 편안하게 이어져요. 너무 빠르게 변하고 즉흥적인 사람과는 속도가 안 맞아 서운해질 수 있어요. 마음이 느리게 열리는 만큼 시간을 두고 신뢰를 쌓아주는 상대를 만나면 평생 가요.','배려가 있으면서 확신을 주는 사람이 좋아요. 애매하게 행동하는 사람 때문에 혼자 속앓이하기 쉬우니, 마음을 분명하게 표현해 주는 상대가 잘 맞아요. 내가 챙겨주는 만큼 고마움을 아는 사람인지 꼭 확인하세요.','존중하고 솔직하게 말해주는 사람과 궁합이 좋아요. 내 직설을 상처로 받는 여린 사람은 서로 힘들 수 있고, 잘잘못을 따질 때 감정 없이 대화할 수 있는 사람이 이상적이에요. 의리를 아는 사람이면 금상첨화예요.','품위 있고 말이 통하는 사람이 어울려요. 말을 함부로 하거나 약속을 가볍게 여기는 사람은 마음의 문을 닫게 만들고, 내 감각과 취향을 인정해 주는 사람이 오래 가요. 서운한 건 바로 말해주는 솔직한 상대가 좋아요.','서로의 자유를 존중하는 관계가 가장 중요해요. 지나치게 구속하거나 감시하는 사람은 숨이 막히고, 각자의 시간을 인정하면서 중요한 순간엔 곁을 지켜주는 사람이 이상적이에요. 대화가 끊이지 않는 지적인 상대면 더 좋아요.','섬세하게 배려하면서도 감정 표현이 분명한 사람이 좋아요. 무뚝뚝하고 표현이 적은 사람은 불안을 키울 수 있으니 확신을 주는 상대를 만나세요. 내가 생각이 많아질 때 가볍게 웃게 해주는 사람이 최고의 인연이에요.'];
const EXT={
매력:['여기에 더해 성장하는 사람 특유의 싱그러움이 있어요. 목표를 향해 꾸준히 자라는 모습이 보일수록 호감도가 올라가고, 처음엔 평범해 보여도 만날수록 믿음이 쌓이는 슬로우 매력형이에요. 자연스러운 모습을 그대로 보여줄 때 가장 빛나요.','여기에 더해 표정과 말투에서 나오는 생기가 큰 무기예요. 웃는 모습과 리액션만으로도 분위기를 바꾸고, 처음 만난 사람도 금방 편하게 만드는 힘이 있어요. 솔직하게 감정을 표현할수록 매력이 더 선명해져요.','여기에 더해 같이 있으면 마음이 놓이는 안정감이 있어요. 화려하진 않아도 오래 볼수록 괜찮은 사람이라는 평가를 받고, 한번 신뢰를 얻으면 주변에서 믿고 기대는 존재가 돼요. 말보다 태도로 호감을 얻는 타입이에요.','여기에 더해 깔끔하고 단정한 인상이 신뢰감을 줘요. 선이 분명하고 말에 군더더기가 없어서 일 잘하는 사람이라는 이미지가 강하고, 가끔 보이는 의외의 다정함이 반전 매력으로 작용해요. 한번 마음을 열면 깊게 챙기는 점도 큰 매력이에요.','여기에 더해 생각이 깊고 말이 잘 통한다는 인상을 줘요. 상대의 이야기를 흘리지 않고 들어주는 태도에서 매력이 나오고, 처음엔 조용해 보여도 대화하다 보면 깊이 있다는 평을 듣는 타입이에요. 알아갈수록 빠져드는 사람이에요.'],
강점:['여기에 더해 배우고 성장하는 속도가 빨라요. 새로운 분야에 들어가도 금방 적응하고, 시간이 지날수록 실력이 쌓이는 장기전에 강한 타입이에요. 목표를 눈에 보이게 적어두면 추진력이 두 배가 돼요.','여기에 더해 사람을 움직이는 에너지가 있어요. 분위기를 만들고 모두를 신나게 하는 능력이라 발표, 영업, 기획처럼 앞에 서는 일에서 두각을 나타내요. 처음 시작하는 순간의 폭발력이 가장 큰 무기예요.','여기에 더해 약속과 책임을 끝까지 지키는 성실함이 있어요. 위기 때 흔들리지 않고 중심을 잡아서 팀에서 믿음직한 사람으로 꼽혀요. 꾸준히 쌓는 일에 강해서 시간이 갈수록 평가가 높아지는 타입이에요.','여기에 더해 판단이 빠르고 정리를 잘해요. 복잡한 상황에서도 핵심을 가려내서 결론을 내고, 맡은 일은 깔끔하게 마무리해요. 원칙과 기준이 분명해서 결정이 필요한 자리에서 특히 빛나요.','여기에 더해 정보를 모으고 연결하는 능력이 뛰어나요. 흐름을 읽는 눈이 좋아 변화에 빨리 대응하고, 아이디어를 확장하는 일에 강해요. 혼자 깊이 생각하는 시간이 곧 경쟁력이 되는 타입이에요.'],
약점:['여기에 더해 마음이 급해지면 주변을 못 보고 밀어붙이는 면이 있어요. 계획이 틀어졌을 때 스트레스를 크게 받고, 꺾이는 상황에서는 쉽게 의욕이 떨어질 수 있어요. 목표를 작게 쪼개서 성취감을 자주 느끼면 훨씬 안정돼요.','여기에 더해 감정이 얼굴에 바로 드러나서 손해를 볼 때가 있어요. 열정이 클수록 식었을 때 낙차도 커서 번아웃이 오기 쉬워요. 하루 중 에너지를 조절하는 시간을 따로 두면 오래 가요.','여기에 더해 걱정이 많아서 시작을 망설이다 기회를 놓칠 수 있어요. 변화를 두려워해 익숙한 곳에 오래 머무르는 경향이 있으니, 작은 새 시도를 의식적으로 늘려 보세요. 속마음을 말로 꺼내는 연습도 필요해요.','여기에 더해 기준이 높아서 스스로와 남에게 엄격해지기 쉬워요. 말이 날카롭게 나가 관계에 거리가 생길 수 있고, 인정받지 못한다고 느끼면 마음의 문을 쉽게 닫아요. 칭찬과 고마움을 말로 표현해 보세요.','여기에 더해 생각이 너무 많아 실행이 늦어지기 쉬워요. 감정이 가라앉을 때는 혼자 깊이 파고들어 우울해질 수 있고, 마음을 숨겨서 오해를 사기도 해요. 생각을 글이나 대화로 꺼내 정리하는 습관이 도움이 돼요.']};
CH.이성3=['이런 사람은 모임이나 스터디, 운동처럼 같은 목표를 향해 움직이는 자리에서 만나기 쉬워요. 사귀기 시작한 뒤에는 결정을 혼자 내리지 말고 상대 의견을 먼저 물어보는 것이 장수 비결이에요. 연애에서 이기려 하지 말고 함께 이기는 방향을 찾아보세요.','이런 사람은 지인의 소개나 오랜 인연 속에서 만나게 될 가능성이 커요. 마음에 드는 신호가 오면 돌려 말하지 말고 한 번은 분명하게 표현해 보세요. 상대에게 맞추기만 하면 지칠 수 있으니 내 취향과 속도도 꼭 말해주세요.','이런 사람은 취미 모임이나 활동적인 자리에서 눈에 띄는 경우가 많아요. 감정이 빨리 달아오르는 만큼 초반 열기에 휩쓸려 결정하지 말고 몇 달 지켜보는 여유가 있으면 좋아요. 서운할 땐 바로 폭발하지 말고 하루 뒤에 차분히 이야기해 보세요.','이런 사람은 조용한 공간이나 공통 관심사가 있는 모임에서 서서히 가까워지는 경우가 많아요. 마음이 깊은 만큼 한 번 상처받으면 오래가니 처음부터 가치관과 연애관을 대화로 확인해 보세요. 속으로만 서운해하지 말고 작게라도 표현하세요.','이런 사람은 직장이나 오래 다닌 모임처럼 꾸준히 마주치는 환경에서 인연이 되기 쉬워요. 마음이 느리게 열리는 편이라 상대가 답답해할 수 있으니 좋아한다는 표현은 말로 해주는 게 좋아요. 변화가 필요할 땐 함께 새로운 경험을 해보세요.','이런 사람은 친구의 친구나 소개팅처럼 신뢰할 수 있는 연결고리를 통해 만나기 좋아요. 상대 눈치를 너무 보며 맞추다 보면 불균형해지니 내가 원하는 것도 분명히 말하는 연습이 필요해요. 챙겨주는 만큼 받는 것도 익숙해지세요.','이런 사람은 일이나 운동처럼 실력과 노력이 드러나는 자리에서 호감이 생기기 쉬워요. 사귄 뒤에는 옳고 그름보다 마음을 먼저 받아주는 대화를 의식하면 오래 가요. 이기려는 싸움 대신 서운함을 먼저 말하는 방식으로 풀어보세요.','이런 사람은 취향이 맞는 전시, 공연, 소규모 모임에서 만나기 좋아요. 기준이 높아 한 번에 마음을 못 정할 수 있으니 완벽한 사람 대신 대화가 편한 사람을 기준으로 삼아 보세요. 서운한 감정은 쌓아두지 말고 그날 안에 짧게라도 전하세요.','이런 사람은 여행, 새로운 모임처럼 낯선 환경에서 자연스럽게 마주치는 경우가 많아요. 자유를 중요하게 여기는 만큼 연락 빈도나 만남 방식을 초반에 서로 합의해 두면 오해가 줄어요. 마음이 흔들릴 땐 혼자 결론 내지 말고 대화로 풀어요.','이런 사람은 조용한 카페나 오래 대화할 수 있는 자리에서 가까워지기 쉬워요. 생각이 많아지는 밤에 연락을 몰아서 하거나 속단하지 말고, 궁금한 건 그때그때 가볍게 물어보세요. 마음을 확인받고 싶을 땐 솔직하게 말하는 게 가장 좋아요.'];
const MONEY3=['구체적으로는 1인 사업, 프리랜서, 동업, 스포츠·교육 사업, 인테리어·시공처럼 내 손과 이름으로 승부하는 분야가 잘 맞아요. 수입이 커지는 시기는 독립해서 내 브랜드를 세웠을 때이고, 월급만으로는 답답함을 느끼기 쉬워요. 처음에는 퇴사 대신 부업으로 작게 검증한 뒤 독립하는 순서가 가장 안전해요. 돈 관리는 사업 계좌와 생활 계좌를 반드시 분리하세요.','구체적으로는 유튜브·블로그·SNS 같은 콘텐츠, 강사·코치, 디자이너, 작가, 요리·뷰티, 마케팅 기획 쪽이 잘 맞아요. 수입이 커지는 시기는 내 이름이 알려지고 팬이 생길 때이고, 한 번 만든 콘텐츠가 계속 수입이 되는 구조를 만드는 게 핵심이에요. 처음엔 수입이 적어도 꾸준히 올리는 6개월이 중요하니 기록과 포트폴리오를 쌓아 두세요.','구체적으로는 온라인 쇼핑몰, 유통·무역, 영업, 부동산, 주식·펀드 같은 금융, 가게 창업처럼 돈이 오가는 일이 잘 맞아요. 수입이 커지는 시기는 기회를 빨리 잡고 판을 키울 때이지만, 욕심이 앞서면 손실도 같이 커져요. 투자는 생활비와 비상금을 따로 떼어둔 뒤 여유자금으로만 하고, 수익이 나면 일부는 바로 현금화하는 습관을 들이세요.','구체적으로는 대기업, 공기업, 공무원, 법률·회계·세무 같은 전문직, 관리자 직군처럼 조직과 자격이 곧 수입이 되는 일이 잘 맞아요. 수입이 커지는 시기는 직급이 오르고 책임이 커질 때이고, 안정적인 만큼 투자나 부업은 보조 수단으로 두는 게 좋아요. 연봉 협상과 이직 타이밍을 스스로 챙기고 자격증으로 몸값을 올리세요.','구체적으로는 교육·강의, 연구, 출판, 상담, IT·데이터 분석, 자격증 기반 전문직처럼 지식을 파는 일이 잘 맞아요. 수입이 커지는 시기는 전문성이 인정받아 의뢰가 들어오기 시작할 때이고, 공부한 내용을 강의나 전자책으로 만들면 수입 구조가 두 배로 커져요. 공부만 하다 실행이 늦어지지 않도록 작은 결과물부터 세상에 내놓으세요.'];
const BR=['일지에 자(子)가 있어 생각이 깊고 영리하며 감수성이 풍부해요. 겉으론 조용해도 속으로 많은 걸 계산하고 느끼는 타입이에요.','일지에 축(丑)이 있어 참을성 있고 우직한 속마음을 가졌어요. 느리지만 한번 시작하면 끝까지 가고, 속정이 깊은 사람이에요.','일지에 인(寅)이 있어 속에 야망과 추진력이 가득해요. 새로운 도전을 좋아하고 자유롭게 움직일 때 가장 힘이 나요.','일지에 묘(卯)가 있어 섬세하고 예술적인 감각이 있어요. 사람을 좋아하지만 상처에도 예민해서 마음을 천천히 열어요.','일지에 진(辰)이 있어 속에 큰 포부와 현실 감각을 함께 품고 있어요. 변화가 많은 삶 속에서 반전을 만드는 힘이 있어요.','일지에 사(巳)가 있어 속이 뜨겁고 영리해요. 눈치와 직관이 빠르고 마음 깊은 곳에 강한 열정과 승부욕이 숨어 있어요.','일지에 오(午)가 있어 감정이 솔직하고 열정적이에요. 표현이 빠르고 화끈하며, 좋고 싫음이 얼굴에 그대로 드러나요.','일지에 미(未)가 있어 속이 따뜻하고 고집이 은근히 세요. 챙기는 마음이 크고 예술적 감성이 있지만 쉽게 내색하지 않아요.','일지에 신(申)이 있어 머리 회전이 빠르고 재주가 많아요. 속으로 계산이 빠르고 임기응변이 좋으며 변화에 강해요.','일지에 유(酉)가 있어 속이 깔끔하고 예민해요. 완성도와 기준이 높고, 자기만의 원칙과 미적 감각이 뚜렷해요.','일지에 술(戌)이 있어 의리와 책임감이 강해요. 속으로는 외로움을 타지만 믿는 사람에겐 끝까지 헌신하는 마음을 가졌어요.','일지에 해(亥)가 있어 속이 깊고 자유로워요. 호기심과 상상력이 풍부하고, 마음이 넓어 사람을 품는 힘이 있어요.'];
const SEN=['태어날 때부터 곧게 뻗으려는 성장 욕구가 강해요. 새로운 일을 시작하고 배우는 걸 좋아하며, 인정과 배려를 중요하게 여겨요. 대신 뜻대로 안 풀리면 답답함을 크게 느껴요.','태어날 때부터 표현 욕구와 열정이 커요. 밝고 솔직하며 사람과 어울릴 때 에너지가 올라가요. 대신 감정 기복과 조급함이 있어서 쉽게 달아오르고 쉽게 식어요.','태어날 때부터 안정과 신뢰를 중요하게 여겨요. 말수는 적어도 묵직하고, 중재하고 포용하는 역할을 자연스럽게 맡아요. 대신 변화를 싫어하고 속을 잘 안 드러내요.','태어날 때부터 원칙과 의리가 뚜렷해요. 옳고 그름을 따지고 결단이 빠르며 한번 정하면 쉽게 안 바꿔요. 대신 말투가 날카롭고 완벽을 요구해 주변이 부담스러울 수 있어요.','태어날 때부터 생각이 깊고 적응력이 좋아요. 흐름을 읽고 지혜롭게 대처하며 자유를 사랑해요. 대신 생각이 많아 걱정이 늘고 속마음을 숨기는 경향이 있어요.'];
const HU=['살면서 경쟁과 독립을 겪으며 자기 주관이 단단해진 모습이에요. 남에게 기대지 않고 스스로 해결하려는 습관이 생겼고, 자존심이 강해졌어요. 사람을 가려 사귀는 면도 후천적으로 생겼어요.','살면서 표현하고 만들어내는 경험이 쌓여 말과 재주가 늘었어요. 눈치와 센스가 좋아졌고 새로운 걸 시도하는 힘이 커졌어요. 다만 생각을 쏟아내다 스스로 지칠 때도 있어요.','살면서 현실과 돈, 사람 관계를 챙기는 감각이 길러졌어요. 계산이 빠르고 실속을 따지며 기회를 보는 눈이 생겼어요. 대신 손익을 따지다 마음 편한 선택을 놓치기도 해요.','살면서 책임과 규칙, 사회적 시선을 의식하며 자기 절제를 배웠어요. 예의 바르고 신중해졌지만, 스스로를 몰아붙이거나 눈치를 많이 보는 습관이 생겼어요.','살면서 공부와 사색, 보호받은 경험으로 생각이 깊어졌어요. 배려와 이해심이 커졌고 신중하게 판단하지만, 행동으로 옮기기 전 망설이는 습관도 생겼어요.'];
const LOOK=['이성 눈에는 성실하고 반듯한 사람으로 보여요. 가능성이 보이고 믿음이 가는 인상이라 오래 만나고 싶은 사람으로 기억돼요. 다만 처음엔 조금 어렵거나 진지해 보일 수 있어요.','이성 눈에는 밝고 매력적이며 에너지 넘치는 사람으로 보여요. 첫인상이 강렬하고 분위기를 주도해서 호감을 얻기 쉬워요. 다만 감정이 급하고 변덕스러워 보일 때가 있어요.','이성 눈에는 든든하고 편안한 사람으로 보여요. 화려하진 않아도 같이 있으면 안심이 되는 인상이라 결혼 상대로 좋게 보는 경우가 많아요. 다만 무뚝뚝하거나 재미없어 보일 수 있어요.','이성 눈에는 깔끔하고 세련되며 선이 분명한 사람으로 보여요. 도도하거나 차가워 보여 다가가기 어렵지만, 알고 나면 의리 있고 다정하다는 반전을 느껴요.','이성 눈에는 신비롭고 깊이 있는 사람으로 보여요. 말수가 적어도 분위기가 있고 대화가 통할 것 같은 인상이에요. 다만 속을 알 수 없다고 느끼게 하거나 거리감이 있어 보일 수 있어요.'];
const LIKE=['책임감 있고 안정적인 사람, 그리고 내 성장을 응원해 주는 사람이 끌려요. 의지할 곳이 필요한 사람이나 조언을 구하는 타입에게 인기가 많고, 연상이나 어른스러운 상대와 잘 맞아요.','밝은 에너지에 끌리는 조용하고 차분한 사람이 많이 호감을 보여요. 내 열정과 표현을 부러워하는 사람이나 분위기를 이끌어주길 바라는 사람에게 인기가 있어요.','마음의 안식처를 찾는 사람, 감정 기복이 있는 사람이 나에게 끌려요. 들어주고 감싸주는 모습에 의지하려는 이성이 많고, 진지하고 오래 만날 사람을 찾는 이성에게 인기가 있어요.','자기 일에 열정적이거나 따뜻하고 부드러운 사람이 나의 단단한 모습에 끌려요. 믿음직하고 결단력 있는 모습을 좋아하는 이성이 많고, 연애에서 확실한 걸 원하는 사람에게 인기가 있어요.','감성적이고 표현이 풍부한 사람이 나의 깊이에 끌려요. 대화가 통하고 이해받고 싶은 이성이 많이 다가오고, 개성 있고 자유로운 사람과도 인연이 잘 닿아요.'];
const X={밀당:['밀당은 솔직한 쪽이라 약한 편이에요. 좋으면 티가 나고 서운하면 바로 말해서 계산된 거리 두기는 어려워요. 대신 진심이 빨리 전해지는 장점이 있고, 밀당보다 신뢰로 가까워지는 연애가 잘 맞아요.','밀당을 할 줄은 알지만 오래 못 끄는 편이에요. 필요할 땐 한 발 물러서 여유를 보이다가도 마음이 커지면 먼저 다가가요. 상대의 반응을 보며 거리를 조절하는 감각이 적당히 있어요.','밀당 고수예요. 상대의 마음이 어디쯤인지 읽고 다가갈 때와 물러날 때를 정확히 알아요. 다만 너무 계산하다 진짜 마음을 놓치거나 상대가 지칠 수 있으니 중요한 순간엔 솔직함을 섞어주세요.'],돈감각:['돈의 흐름이나 투자 감각은 평범한 편이에요. 한 방을 노리는 판단은 약하지만 대신 무리한 욕심이 적어서 큰 손해를 피해요. 기술이나 꾸준한 수입으로 쌓아가는 게 맞아요.','돈 냄새를 어느 정도 맡는 편이에요. 좋은 기회가 오면 알아보지만 확신이 부족해 놓칠 때가 있어요. 공부하고 정보를 모은 뒤 움직이면 성공 확률이 높아져요.','돈의 흐름과 기회를 보는 눈이 좋아요. 싸게 사서 비싸게 팔거나 사람과 시장의 변화를 읽는 감각이 있고, 수익 구조를 만드는 데 재능이 있어요. 다만 자신감이 지나치면 큰 손실이 날 수 있어요.'],관리:['들어오는 돈보다 나가는 돈이 많아지기 쉬워요. 기분이나 사람 관계에 쓰는 돈이 많아 저축이 어렵고, 충동구매가 잦을 수 있어요. 자동이체와 지출 한도를 정해두면 크게 달라져요.','기본적인 관리는 하지만 가끔 지출이 새는 편이에요. 목표가 생기면 아끼는 힘이 생기고, 가계부나 앱을 쓰면 훨씬 안정돼요. 큰돈 쓸 때만 한 번 더 생각하는 습관이 중요해요.','돈 관리가 꼼꼼하고 절제력이 좋아요. 계획대로 저축하고 지출을 통제하며, 장기적으로 자산을 불리는 힘이 있어요. 다만 너무 아끼다 정작 쓸 때 놓치지 않도록 나에게 쓰는 돈도 챙기세요.'],영업:['영업이나 설득은 부담스러운 편이에요. 밀어붙이는 것보다 진정성과 전문성으로 신뢰를 쌓는 방식이 맞고, 단골을 천천히 만드는 장기 관계형이에요.','필요한 순간엔 설득할 줄 아는 무난한 영업력이에요. 제품이나 일에 확신이 있을 때 말이 잘 나오고, 상대 반응을 보며 조절해요. 연습하면 금방 늘어요.','영업과 설득에 재능이 있어요. 상대의 필요를 빨리 파악하고 호감을 얻어 계약까지 이끄는 힘이 있어요. 말과 분위기를 모두 활용해 사람을 움직이니 고객을 다루는 일에서 빛나요.'],정치:['조직 내 정치나 줄서기에는 약한 편이에요. 실력으로 말하는 쪽이고 계산된 행동이 불편해서 손해를 볼 때가 있어요. 대신 신뢰가 쌓이면 진심으로 인정받는 타입이에요.','필요할 땐 흐름을 읽고 처신하는 정도의 정치력이에요. 누가 중요한 사람인지 알지만 지나치게 나서지는 않아요. 중요한 자리에서만 전략을 쓰면 충분해요.','조직과 관계의 판을 읽는 정치력이 뛰어나요. 누구와 연결돼야 하는지, 언제 나서고 빠질지 알고 있어서 리더 곁이나 중간 관리자 자리에서 특히 강해요. 다만 계산이 티 나지 않게 진정성도 챙기세요.'],친화:['처음 만난 사람과 가까워지는 데 시간이 걸려요. 낯을 가리고 경계가 있지만, 한번 친해지면 깊고 오래 가요. 소수의 사람과 진하게 지내는 편이 잘 맞아요.','사람과 적당히 어울리고 적당히 거리를 두는 균형형이에요. 모임에서 튀지 않으면서도 편안하게 대화를 이어가고 필요할 땐 먼저 다가가요.','누구와도 금방 친해지는 친화력이 있어요. 분위기를 편하게 만들어서 처음 보는 사람도 마음을 열게 하고, 모임에서 사람을 이어주는 역할을 해요. 다만 너무 퍼주다 지치지 않게 선을 정해 두세요.']};
const EL_MANY=['사주에 목(木)의 기운이 가장 많아서 성장 욕구와 추진력, 배우려는 의욕이 두드러져요. 새로운 일을 벌이는 걸 좋아하고 자존심과 자기 주장이 뚜렷한 편이에요.','사주에 화(火)의 기운이 가장 많아서 열정과 표현력이 두드러져요. 분위기를 띄우고 감정을 솔직하게 드러내며, 에너지가 크지만 쉽게 지치기도 해요.','사주에 토(土)의 기운이 가장 많아서 안정감과 신중함이 두드러져요. 포용력이 크고 믿음직하지만 고집이 세고 변화에 느려서 기회를 놓치기도 해요.','사주에 금(金)의 기운이 가장 많아서 결단력과 원칙, 의리가 두드러져요. 맺고 끊음이 분명하고 승부욕이 있지만 말이 날카로워 오해를 사기 쉬워요.','사주에 수(水)의 기운이 가장 많아서 지혜와 직관, 적응력이 두드러져요. 생각이 깊고 유연하지만 걱정과 생각이 많아 실행이 느려질 수 있어요.'];

  f.formatToParts(t).forEach(x=>p[x.type]=x.value);
